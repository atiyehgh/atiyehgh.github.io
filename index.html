<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عطیه قیومی‌پور | مدیر دیجیتال مارکتینگ Alka</title>
  <style>
    :root {
      --bg: #141210;
      --card-bg: #1e1b17;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f5f2eb;
      --text-muted: #a39e93;
      --accent: #d4a373;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 40px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      color: var(--accent);
      font-size: 1.1rem;
    }

    .section-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--text);
      border-right: 4px solid var(--accent);
      padding-right: 12px;
    }

    .story-group {
      margin-bottom: 40px;
    }

    .story-group-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--text-muted);
    }

    .story-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    /* استایل کارت‌های استوری و بج شماره‌گذاری */
    .story-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      height: 420px;
      cursor: pointer;
      position: relative;
    }

    .story-item::before {
      content: attr(data-index);
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .story-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .story-empty {
      color: var(--text-muted);
      text-align: center;
      padding: 20px;
    }

    /* لایت‌باکس ساده برای نمایش بزرگ عکس */
    #lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      cursor: pointer;
    }
    #lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="portfolioName">عطیه قیومی‌پور</h1>
      <p id="portfolioTitle">مدیر دیجیتال مارکتینگ برند Alka</p>
    </header>

    <section>
      <h2 class="section-title">استوری‌های Alka</h2>
      <div id="storyGallery"></div>
    </section>
  </div>

  <!-- لایت‌باکس -->
  <div id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="Zoomed">
  </div>

  <!-- بارگذاری فایل داده‌ها -->
  <script src="data.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    function renderStories(){
      const container = $("storyGallery");
      container.innerHTML = "";
      
      if(!portfolio.storyGroups || portfolio.storyGroups.length === 0){
        container.innerHTML = `<div class="story-empty">استوری‌های پروژه هنوز اضافه نشده‌اند.</div>`;
        return;
      }

      portfolio.storyGroups.forEach(group => {
        const groupDiv = document.createElement("div");
        groupDiv.className = "story-group";

        const titleEl = document.createElement("h3");
        titleEl.className = "story-group-title";
        titleEl.textContent = group.groupTitle;
        groupDiv.appendChild(titleEl);

        const gridDiv = document.createElement("div");
        gridDiv.className = "story-gallery";

        group.items.forEach(item => {
          const wrap = document.createElement("div");
          wrap.className = "story-item";
          
          // اعمال شماره‌گذاری ترتیبی عکس‌ها از دیتای تولید شده توسط پایتون
          if(item.index) {
            wrap.setAttribute("data-index", item.index);
          }

          const img = document.createElement("img");
          img.src = item.src; 
          img.alt = item.alt || ""; 
          img.loading = "lazy";
          
          img.onerror = function(){ 
            wrap.style.display = "none"; 
          };

          wrap.appendChild(img);
          
          wrap.onclick = function(){ 
            openLightbox(item.src); 
          };

          gridDiv.appendChild(wrap);
        });

        groupDiv.appendChild(gridDiv);
        container.appendChild(groupDiv);
      });
    }

    function openLightbox(src){
      $("lightboxImg").src = src;
      $("lightbox").style.display = "flex";
    }

    function closeLightbox(){
      $("lightbox").style.display = "none";
    }

    // مقداردهی اولیه پس از لود صفحه
    window.onload = function() {
      if (typeof portfolio !== 'undefined') {
        if(portfolio.name) $("portfolioName").textContent = portfolio.name;
        if(portfolio.title) $("portfolioTitle").textContent = portfolio.title;
        renderStories();
      }
    };
  </script>
</body>
</html>
