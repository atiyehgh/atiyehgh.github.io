backend:
  name: github
  repo: atiyehgh/atiyehgh.github.io
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple
locale: "fa"

collections:

  # =========================
  # تنظیمات سایت
  # =========================
  - name: "settings"
    label: "⚙️ تنظیمات سایت"
    files:

      - file: "content/site.json"
        label: "اطلاعات و ظاهر سایت"
        name: "site_settings"

        fields:

          # ---------- Hero ----------
          - label: "🏠 صفحه اصلی"
            name: "hero"
            widget: "object"
            fields:

              - label: "نام"
                name: "name"
                widget: "string"
                required: true

              - label: "عنوان شغلی"
                name: "role"
                widget: "string"

              - label: "توضیح کوتاه"
                name: "tagline"
                widget: "text"

              - label: "عکس اصلی"
                name: "image"
                widget: "image"
                required: false

              - label: "متن دکمه اصلی"
                name: "primaryButton"
                widget: "string"
                required: false

              - label: "لینک دکمه اصلی"
                name: "primaryButtonUrl"
                widget: "string"
                required: false

              - label: "متن دکمه دوم"
                name: "secondaryButton"
                widget: "string"
                required: false

              - label: "لینک دکمه دوم"
                name: "secondaryButtonUrl"
                widget: "string"
                required: false


          # ---------- About ----------
          - label: "👩🏻 درباره من"
            name: "about"
            widget: "object"
            fields:

              - label: "عنوان"
                name: "heading"
                widget: "string"

              - label: "متن معرفی"
                name: "body"
                widget: "text"

              - label: "خدمات"
                name: "services"
                widget: "list"
                required: false
                field:
                  label: "خدمت"
                  name: "service"
                  widget: "string"

              - label: "برچسب‌ها"
                name: "tags"
                widget: "list"
                required: false
                field:
                  label: "برچسب"
                  name: "tag"
                  widget: "string"


          # ---------- Contact ----------
          - label: "📞 اطلاعات تماس"
            name: "contact"
            widget: "object"
            fields:

              - label: "ایمیل"
                name: "email"
                widget: "string"
                required: false

              - label: "اینستاگرام"
                name: "instagram"
                widget: "string"
                required: false

              - label: "لینکدین"
                name: "linkedin"
                widget: "string"
                required: false

              - label: "تلگرام"
                name: "telegram"
                widget: "string"
                required: false


          # ---------- Appearance ----------
          - label: "🎨 ظاهر سایت"
            name: "appearance"
            widget: "object"
            fields:

              - label: "رنگ پس‌زمینه"
                name: "bg_color"
                widget: "color"
                required: false

              - label: "رنگ کارت‌ها"
                name: "card_color"
                widget: "color"
                required: false

              - label: "رنگ متن"
                name: "text_color"
                widget: "color"
                required: false

              - label: "رنگ اصلی"
                name: "accent_color"
                widget: "color"
                required: false

              - label: "رنگ اصلی دوم"
                name: "accent2_color"
                widget: "color"
                required: false


  # =========================
  # پروژه‌ها
  # =========================
  - name: "projects"
    label: "📁 پروژه‌ها"
    folder: "content/projects"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"

    fields:

      - label: "نام پروژه"
        name: "title"
        widget: "string"
        required: true

      - label: "برند / مشتری"
        name: "brand"
        widget: "string"
        required: false

      - label: "مدت همکاری"
        name: "duration"
        widget: "string"
        required: false

      - label: "توضیحات پروژه"
        name: "lead"
        widget: "text"
        required: false

      - label: "🎯 حوزه‌های فعالیت"
        name: "scope"
        widget: "list"
        required: false
        field:
          label: "حوزه"
          name: "item"
          widget: "string"


      # ---------- Stats ----------
      - label: "📊 آمار و نتایج"
        name: "stats"
        widget: "object"
        fields:

          - label: "بازدید قبل"
            name: "views_before"
            widget: "string"
            required: false

          - label: "بازدید بعد"
            name: "views_after"
            widget: "string"
            required: false

          - label: "ضریب رشد بازدید"
            name: "views_mult"
            widget: "string"
            required: false

          - label: "تعامل قبل"
            name: "engagement_before"
            widget: "string"
            required: false

          - label: "تعامل بعد"
            name: "engagement_after"
            widget: "string"
            required: false

          - label: "ضریب رشد تعامل"
            name: "engagement_mult"
            widget: "string"
            required: false

          - label: "رشد فالوور"
            name: "followers_growth"
            widget: "string"
            required: false

          - label: "درصد رشد فالوور"
            name: "followers_percent"
            widget: "string"
            required: false

          - label: "ریپلای استوری"
            name: "replies"
            widget: "string"
            required: false


      # ---------- Media ----------
      - label: "🖼️ تصاویر"
        name: "proofImages"
        widget: "list"
        required: false
        field:
          label: "تصویر"
          name: "image"
          widget: "image"

      - label: "🖼️ گالری پروژه"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "تصویر"
          name: "image"
          widget: "image"


      # ---------- Details ----------
      - label: "📝 چالش"
        name: "challenge"
        widget: "text"
        required: false

      - label: "📝 راهکار"
        name: "solution"
        widget: "text"
        required: false

      - label: "📝 نتیجه"
        name: "result"
        widget: "text"
        required: false


  # =========================
  # استوری‌ها
  # =========================
  - name: "story_series"
    label: "📱 رشته‌های استوری"
    folder: "content/story-series"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"

    fields:

      - label: "عنوان"
        name: "title"
        widget: "string"
        required: true

      - label: "ماه / تاریخ"
        name: "month"
        widget: "string"
        required: false

      - label: "توضیحات"
        name: "description"
        widget: "text"
        required: false

      - label: "تصویر کاور"
        name: "cover"
        widget: "image"
        required: false

      - label: "🖼️ تصاویر"
        name: "images"
        widget: "list"
        required: false
        field:
          label: "تصویر"
          name: "image"
          widget: "image"

      - label: "📎 فایل‌ها"
        name: "files"
        widget: "list"
        required: false
        fields:

          - label: "نام فایل"
            name: "name"
            widget: "string"

          - label: "فایل"
            name: "file"
            widget: "file"


  # =========================
  # تقویم
  # =========================
  - name: "calendar"
    label: "📅 تقویم محتوایی"
    files:

      - file: "content/calendar.json"
        label: "تقویم محتوایی"
        name: "content_calendar"

        fields:

          - label: "عنوان تقویم"
            name: "title"
            widget: "string"
            required: false

          - label: "بازه زمانی"
            name: "period"
            widget: "string"
            required: false

          - label: "توضیحات"
            name: "description"
            widget: "text"
            required: false

          - label: "🗓️ برنامه محتوا"
            name: "days"
            widget: "list"
            required: false
            fields:

              - label: "روز / تاریخ"
                name: "day"
                widget: "string"

              - label: "محتوا"
                name: "content"
                widget: "string"

              - label: "فرمت"
                name: "format"
                widget: "select"
                options:
                  - "پست"
                  - "ریل"
                  - "استوری"
                  - "کاروسل"
                  - "لایو"
                  - "سایر"

              - label: "موضوع"
                name: "topic"
                widget: "string"
                required: false

              - label: "وضعیت"
                name: "status"
                widget: "select"
                options:
                  - "ایده"
                  - "در حال آماده‌سازی"
                  - "آماده انتشار"
                  - "منتشر شده"
                required: false

          - label: "📎 فایل‌های تقویم"
            name: "visual"
            widget: "object"
            required: false
            fields:

              - label: "تصویر"
                name: "image"
                widget: "image"
                required: false

              - label: "PDF"
                name: "pdf"
                widget: "file"
                required: false

              - label: "Excel"
                name: "excel"
                widget: "file"
                required: false

              - label: "فایل ضمیمه"
                name: "attachment"
                widget: "file"
                required: false