backend:
  name: github
  repo: atiyehgh/atiyehgh.github.io
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple
locale: "fa"

collections:

  # =========================
  # تنظیمات اصلی سایت
  # =========================
  - name: "settings"
    label: "⚙️ تنظیمات سایت"
    files:

      - file: "content/settings.json"
        label: "اطلاعات و ظاهر سایت"
        name: "site_settings"

        fields:

          # ---------- Hero ----------
          - label: "🏠 صفحه اصلی"
            name: "hero"
            widget: "object"
            fields:

              - label: "نام"
                name: "name"
                widget: "string"
                required: true

              - label: "عنوان شغلی"
                name: "role"
                widget: "string"

              - label: "توضیح کوتاه"
                name: "tagline"
                widget: "text"

              - label: "عکس اصلی"
                name: "image"
                widget: "image"
                required: false

              - label: "متن دکمه اصلی"
                name: "primaryButton"
                widget: "string"
                required: false

              - label: "لینک دکمه اصلی"
                name: "primaryButtonUrl"
                widget: "string"
                required: false

              - label: "متن دکمه دوم"
                name: "secondaryButton"
                widget: "string"
                required: false

              - label: "لینک دکمه دوم"
                name: "secondaryButtonUrl"
                widget: "string"
                required: false


          # ---------- About ----------
          - label: "👩🏻 درباره من"
            name: "about"
            widget: "object"
            fields:

              - label: "عنوان"
                name: "heading"
                widget: "string"

              - label: "متن معرفی"
                name: "body"
                widget: "text"

              - label: "خدمات"
                name: "services"
                widget: "list"
                required: false
                field:
                  label: "خدمت"
                  name: "service"
                  widget: "string"


          # ---------- Contact ----------
          - label: "📞 اطلاعات تماس"
            name: "contact"
            widget: "object"
            fields:

              - label: "ایمیل"
                name: "email"
                widget: "string"
                required: false

              - label: "اینستاگرام"
                name: "instagram"
                widget: "string"
                required: false

              - label: "لینکدین"
                name: "linkedin"
                widget: "string"
                required: false

              - label: "تلگرام"
                name: "telegram"
                widget: "string"
                required: false


          # ---------- Appearance ----------
          - label: "🎨 ظاهر سایت"
            name: "appearance"
            widget: "object"
            fields:

              - label: "رنگ اصلی"
                name: "primaryColor"
                widget: "color"
                required: false

              - label: "رنگ پس‌زمینه"
                name: "backgroundColor"
                widget: "color"
                required: false

              - label: "رنگ کارت‌ها"
                name: "cardColor"
                widget: "color"
                required: false

              - label: "رنگ متن"
                name: "textColor"
                widget: "color"
                required: false

              - label: "رنگ متن فرعی"
                name: "mutedColor"
                widget: "color"
                required: false

              - label: "گردی گوشه کارت‌ها"
                name: "cardRadius"
                widget: "number"
                required: false
                value_type: "int"
                min: 0
                max: 50

              - label: "حالت نمایش"
                name: "layout"
                widget: "select"
                options:
                  - "modern"
                  - "minimal"
                  - "editorial"
                required: false


  # =========================
  # پروژه‌ها
  # =========================
  - name: "projects"
    label: "📁 پروژه‌ها"
    folder: "content/projects"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"

    fields:

      - label: "اطلاعات پروژه"
        name: "project_info"
        widget: "object"
        fields:

          - label: "نام پروژه"
            name: "title"
            widget: "string"
            required: true

          - label: "برند / مشتری"
            name: "brand"
            widget: "string"
            required: false

          - label: "مدت همکاری"
            name: "duration"
            widget: "string"
            required: false

          - label: "نقش من"
            name: "lead"
            widget: "string"
            required: false

          - label: "تصویر کاور"
            name: "cover"
            widget: "image"
            required: false

          - label: "لینک پروژه"
            name: "url"
            widget: "string"
            required: false


      - label: "🎯 حوزه‌های فعالیت"
        name: "scope"
        widget: "list"
        required: false
        field:
          label: "حوزه"
          name: "item"
          widget: "string"


      - label: "📊 آمار و نتایج"
        name: "stats"
        widget: "list"
        required: false
        fields:

          - label: "عنوان"
            name: "label"
            widget: "string"

          - label: "مقدار"
            name: "value"
            widget: "string"


      - label: "🖼️ تصاویر و فایل‌ها"
        name: "media"
        widget: "object"
        fields:

          - label: "تصاویر نمونه کار"
            name: "proofImages"
            widget: "list"
            required: false
            field:
              label: "تصویر"
              name: "image"
              widget: "image"

          - label: "گالری پروژه"
            name: "gallery"
            widget: "list"
            required: false
            field:
              label: "تصویر"
              name: "image"
              widget: "image"

          - label: "PDF پروژه"
            name: "report_pdf"
            widget: "file"
            required: false
            media_library:
              config:
                multiple: false

          - label: "فایل ضمیمه"
            name: "attachment"
            widget: "file"
            required: false
            media_library:
              config:
                multiple: false


      - label: "📝 توضیحات پروژه"
        name: "details"
        widget: "object"
        fields:

          - label: "چالش"
            name: "challenge"
            widget: "text"
            required: false

          - label: "راهکار"
            name: "solution"
            widget: "text"
            required: false

          - label: "نتیجه"
            name: "result"
            widget: "text"
            required: false


  # =========================
  # استوری‌ها
  # =========================
  - name: "story_series"
    label: "📱 رشته‌های استوری"
    folder: "content/story-series"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"

    fields:

      - label: "عنوان رشته استوری"
        name: "title"
        widget: "string"
        required: true

      - label: "ماه / تاریخ"
        name: "month"
        widget: "string"
        required: false

      - label: "توضیحات"
        name: "description"
        widget: "text"
        required: false

      - label: "تصویر کاور"
        name: "cover"
        widget: "image"
        required: false

      - label: "🖼️ تصاویر استوری"
        name: "images"
        widget: "list"
        required: false
        field:
          label: "تصویر"
          name: "image"
          widget: "image"

      - label: "📎 فایل‌های استوری"
        name: "files"
        widget: "list"
        required: false
        fields:

          - label: "نام فایل"
            name: "name"
            widget: "string"

          - label: "فایل"
            name: "file"
            widget: "file"


  # =========================
  # تقویم محتوایی
  # =========================
  - name: "calendar"
    label: "📅 تقویم محتوایی"
    files:

      - file: "content/calendar.json"
        label: "تقویم محتوایی"
        name: "content_calendar"

        fields:

          - label: "عنوان تقویم"
            name: "title"
            widget: "string"
            required: false

          - label: "بازه زمانی"
            name: "period"
            widget: "string"
            required: false

          - label: "توضیحات"
            name: "description"
            widget: "text"
            required: false


          # ---------- روزهای تقویم ----------
          - label: "🗓️ برنامه محتوا"
            name: "days"
            widget: "list"
            required: false
            fields:

              - label: "روز / تاریخ"
                name: "day"
                widget: "string"

              - label: "محتوا"
                name: "content"
                widget: "string"

              - label: "فرمت"
                name: "format"
                widget: "select"
                options:
                  - "پست"
                  - "ریل"
                  - "استوری"
                  - "کاروسل"
                  - "لایو"
                  - "سایر"

              - label: "موضوع"
                name: "topic"
                widget: "string"
                required: false

              - label: "وضعیت"
                name: "status"
                widget: "select"
                options:
                  - "ایده"
                  - "در حال آماده‌سازی"
                  - "آماده انتشار"
                  - "منتشر شده"
                required: false


          # ---------- فایل‌های تقویم ----------
          - label: "📎 فایل‌های تقویم"
            name: "visual"
            widget: "object"
            required: false
            fields:

              - label: "تصویر تقویم"
                name: "image"
                widget: "image"
                required: false

              - label: "PDF تقویم"
                name: "pdf"
                widget: "file"
                required: false

              - label: "فایل Excel"
                name: "excel"
                widget: "file"
                required: false

              - label: "فایل ضمیمه"
                name: "attachment"
                widget: "file"
                required: false
